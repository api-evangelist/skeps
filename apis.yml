aid: skeps
name: Skeps
description: >-
  Skeps is a business-to-business embedded finance and pay-over-time platform that
  lets merchants and lenders offer point-of-sale financing directly inside their
  own websites, retail stores, and one-to-one sales channels. Built as a microservices
  platform, Skeps embeds banking and lending services into the buyer journey: its
  patented technology securely and in real time matches a customer to the best
  financing offer from a multi-lender network of national banks, credit unions, and
  fintech lenders, powering pre-approval, offer testing, and checkout financing. Skeps
  serves verticals including home improvement, retail, telecom, travel and hospitality,
  health and wellness, automotive, veterinary, financial institutions, and cobrand
  card programs. It operates an enterprise, request-a-demo sales model and is backed by
  Accel; this API Evangelist profile was enriched from its public web surface.
